<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00c8ff" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>RescueLink – Emergency Care System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #050d1a;
        color: #e0eaff;
        font-family: 'Rajdhani', sans-serif;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #0a1628; }
      ::-webkit-scrollbar-thumb { background: #1e4080; border-radius: 3px; }
      
      /* Mobile responsiveness utilities */
      button, .btn-touch-target {
        min-height: 44px;
        min-width: 44px;
      }
      @media (max-width: 768px) {
        .responsive-grid {
          grid-template-columns: 1fr !important;
        }
        .responsive-flex {
          flex-direction: column !important;
        }
        .responsive-width {
          width: 100% !important;
          max-width: 100% !important;
        }
      }
    </style>
  </head>
  
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').then(registration => {
            console.log('[PWA] Service Worker registered with scope: ', registration.scope);
          }).catch(err => {
            console.log('[PWA] Service Worker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
